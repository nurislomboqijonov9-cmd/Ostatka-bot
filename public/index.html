<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Ombor hisobi</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin:0; background:#020617; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    try { if (window.Telegram?.WebApp) { Telegram.WebApp.ready(); Telegram.WebApp.expand(); } } catch(e){}

    const QUICK = [10, 50, 100, 500];
    const fmt = (n) => (Number(n)||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    const fmtTime = (ts) => {
      const d = new Date(ts); const p = (x)=>String(x).padStart(2,"0");
      return `${p(d.getDate())}.${p(d.getMonth()+1)} ${p(d.getHours())}:${p(d.getMinutes())}`;
    };
    const hazard = { backgroundImage: "repeating-linear-gradient(45deg,#f59e0b 0 11px,#0f172a 11px 22px)" };

    let APP_PW = "";
    async function api(url, opts = {}) {
      const headers = { ...(opts.headers || {}), "x-app-password": APP_PW };
      const res = await fetch(url, { ...opts, headers });
      const data = await res.json().catch(()=>({}));
      if (res.status === 401) throw new Error("auth");
      if (!res.ok) throw new Error(data.error || "err");
      return data;
    }

    function Stat({label, value, tone}) {
      const tones = { slate:"text-slate-200", amber:"text-amber-400", rose:"text-rose-400" };
      return (
        <div className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5">
          <div className={`mono text-xl font-bold leading-none ${tones[tone]}`}>{value}</div>
          <div className="text-[10px] uppercase tracking-wider text-slate-500 mt-1.5">{label}</div>
        </div>
      );
    }

    function App() {
      const [products, setProducts] = useState([]);
      const [history, setHistory] = useState([]);
      const [loading, setLoading] = useState(true);
      const [tab, setTab] = useState("ombor");
      const [search, setSearch] = useState("");
      const [edit, setEdit] = useState(false);
      const [sheet, setSheet] = useState(null);
      const [qty, setQty] = useState("");
      const [toast, setToast] = useState(null);
      const [err, setErr] = useState("");
      const [histProduct, setHistProduct] = useState(null);
      const [confirmReset, setConfirmReset] = useState(false);
      const [authed, setAuthed] = useState(false);
      const [pw, setPw] = useState("");
      const [pwErr, setPwErr] = useState("");
      const [newName, setNewName] = useState("");
      const [newQty, setNewQty] = useState("");
      const [delId, setDelId] = useState(null);
      const [editId, setEditId] = useState(null);

      const loadAll = async () => {
        const [pr, hr] = await Promise.all([api("/api/products"), api("/api/history")]);
        setProducts(pr); setHistory(hr);
      };

      useEffect(() => {
        (async () => {
          let saved = "";
          try { saved = localStorage.getItem("ombor_pw") || ""; } catch(e){}
          if (saved) {
            APP_PW = saved;
            try { await loadAll(); setAuthed(true); }
            catch(e){ APP_PW = ""; }
          }
          setLoading(false);
        })();
      }, []);

      const submitPw = async () => {
        APP_PW = pw.trim();
        try {
          await loadAll();
          try { localStorage.setItem("ombor_pw", pw.trim()); } catch(e){}
          setAuthed(true); setPwErr("");
        } catch(e) {
          setPwErr("Parol xato"); APP_PW = "";
        }
      };

      const logout = () => {
        try { localStorage.removeItem("ombor_pw"); } catch(e){}
        APP_PW = ""; setAuthed(false); setPw(""); setEdit(false);
      };

      const showToast = (t) => { setToast(t); setTimeout(()=>setToast(null), 2200); };

      const active = products.find((p) => p.id === sheet);
      const totals = useMemo(() => {
        const outUnits = products.reduce((s,p)=>s+p.out,0);
        const empty = products.filter((p)=>p.total-p.out<=0).length;
        return { outUnits, empty, types: products.length };
      }, [products]);
      const filtered = useMemo(() =>
        products.filter((p)=>p.name.toLowerCase().includes(search.trim().toLowerCase())), [products, search]);

      const openSheet = (id) => { setSheet(id); setQty(""); setErr(""); };
      const closeSheet = () => { setSheet(null); setQty(""); setErr(""); };

      const doMove = async (type) => {
        const n = parseInt(qty,10);
        if (!n || n<=0) return setErr("Sonni kiriting");
        const p = active, avail = p.total - p.out;
        if (type==="out" && n>avail) return setErr(`Omborda faqat ${fmt(avail)} ta bor`);
        if (type==="writeoff" && n>avail) return setErr(`Omborda faqat ${fmt(avail)} ta bor`);
        if (type==="ret" && n>p.out) return setErr(`Arendada faqat ${fmt(p.out)} ta bor`);
        const name = p.name;
        closeSheet();
        try {
          await api("/api/move", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({pid:p.id,type,qty:n}) });
          await loadAll();
          const w = type==="out" ? "chiqdi" : type==="ret" ? "qaytdi" : "hisobdan chiqarildi";
          showToast({ type, text:`${fmt(n)} ${name} ${w}` });
        } catch(e){ showToast({type:"err", text:"Saqlanmadi — qayta urinib ko'ring"}); }
      };

      const addStock = async () => {
        const n = parseInt(qty,10);
        if (!n || n<=0) return setErr("Sonni kiriting");
        const p = active, name = p.name;
        closeSheet();
        try {
          await api("/api/move", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({pid:p.id,type:"add",qty:n}) });
          await loadAll();
          showToast({ type:"add", text:`${fmt(n)} ${name} omborga qo'shildi` });
        } catch(e){ showToast({type:"err", text:"Saqlanmadi — qayta urinib ko'ring"}); }
      };

      const setTotal = async (id, val) => {
        const t = Math.max(0, parseInt(val,10)||0);
        try { await api("/api/total", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({pid:id,total:t}) }); await loadAll(); }
        catch(e){ showToast({type:"err", text:"Saqlanmadi"}); }
      };

      const doReset = async () => {
        try { await api("/api/reset", { method:"POST" }); await loadAll(); setConfirmReset(false); setEdit(false); showToast({type:"ret", text:"Hammasi 0 qilindi"}); }
        catch(e){ showToast({type:"err", text:"Bo'lmadi"}); }
      };

      const addProduct = async () => {
        const name = newName.trim();
        if (!name) return;
        try {
          await api("/api/product", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({name, total: parseInt(newQty,10)||0}) });
          await loadAll(); setNewName(""); setNewQty(""); showToast({type:"add", text:`${name} qo'shildi`});
        } catch(e){ showToast({type:"err", text:"Qo'shilmadi"}); }
      };

      const delProduct = async (id) => {
        try { await api("/api/product-delete", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({id}) }); await loadAll(); setDelId(null); showToast({type:"writeoff", text:"O'chirildi"}); }
        catch(e){ showToast({type:"err", text:"O'chmadi"}); }
      };

      const renameProduct = async (id, name) => {
        name = (name||"").trim();
        if (!name) return;
        try { await api("/api/product-rename", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({id, name}) }); await loadAll(); showToast({type:"add", text:"Nom o'zgartirildi"}); }
        catch(e){ showToast({type:"err", text:"Bo'lmadi"}); }
      };

      if (loading) return (
        <div className="min-h-screen bg-slate-950 text-slate-400 flex items-center justify-center">
          <div className="animate-pulse text-sm tracking-wider uppercase">Yuklanmoqda…</div>
        </div>
      );

      if (!authed) return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center px-6" style={{fontFamily:"system-ui,-apple-system,sans-serif"}}>
          <div className="w-full max-w-xs">
            <div className="text-center mb-6">
              <div className="w-14 h-14 rounded-2xl bg-amber-500/15 border border-amber-500/30 flex items-center justify-center text-3xl mx-auto mb-3">🔒</div>
              <h1 className="text-xl font-bold">Ombor hisobi</h1>
              <p className="text-xs text-slate-500 uppercase tracking-widest mt-1">Parolni kiriting</p>
            </div>
            <input
              type="password" inputMode="numeric" autoFocus value={pw}
              onChange={e=>{setPw(e.target.value); setPwErr("");}}
              onKeyDown={e=>{ if(e.key==="Enter") submitPw(); }}
              placeholder="••••"
              className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-lg text-center outline-none focus:border-amber-500 mono text-slate-100 mb-3"
            />
            {pwErr && <div className="text-rose-400 text-sm text-center mb-3">{pwErr}</div>}
            <button onClick={submitPw} className="w-full bg-amber-500 text-slate-950 font-bold py-3.5 rounded-xl active:bg-amber-600">Kirish</button>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 pb-24" style={{fontFamily:"system-ui,-apple-system,sans-serif"}}>
          <div className="bg-slate-900 border-b border-slate-800">
            <div className="max-w-lg mx-auto px-4 pt-5 pb-4">
              <div className="flex items-center justify-between">
                <div>
                  <h1 className="text-xl font-bold tracking-tight">Ombor hisobi</h1>
                  <p className="text-xs text-slate-500 mt-0.5 uppercase tracking-widest">Lesa jihozlari · arenda</p>
                </div>
                <button onClick={()=>setEdit(v=>!v)} className={`text-xs font-semibold px-3 py-2 rounded-lg border transition ${edit?"bg-amber-500 text-slate-950 border-amber-500":"bg-slate-800 text-slate-300 border-slate-700"}`}>
                  {edit ? "Tayyor" : "Sozlash"}
                </button>
              </div>
              <div className="grid grid-cols-3 gap-2 mt-4">
                <Stat label="Turlar" value={totals.types} tone="slate" />
                <Stat label="Arendada" value={fmt(totals.outUnits)} tone="amber" />
                <Stat label="Tugagan" value={totals.empty} tone={totals.empty?"rose":"slate"} />
              </div>
            </div>
            <div style={hazard} className="h-2" />
          </div>

          <div className="max-w-lg mx-auto px-4 pt-4">
            <div className="flex gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800">
              {[["ombor","Ombor"],["tarix","Tarix"]].map(([k,l])=>(
                <button key={k} onClick={()=>setTab(k)} className={`flex-1 py-2.5 rounded-lg text-sm font-semibold transition ${tab===k?"bg-slate-100 text-slate-900":"text-slate-400"}`}>{l}</button>
              ))}
            </div>
          </div>

          {tab==="ombor" && (
            <div className="max-w-lg mx-auto px-4 mt-4">
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Mahsulot qidirish…"
                className="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm outline-none focus:border-slate-600 mb-3 placeholder:text-slate-600 text-slate-100" />
              {edit && (
                <div className="bg-slate-900 border border-sky-800/50 rounded-xl p-3 mb-3">
                  <div className="text-xs text-sky-300 font-semibold mb-2 uppercase tracking-wider">Yangi tovar qo'shish</div>
                  <input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Tovar nomi (masalan: Setka 2m)"
                    className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm outline-none focus:border-sky-500 mb-2 text-slate-100" />
                  <div className="flex gap-2">
                    <input type="number" value={newQty} onChange={e=>setNewQty(e.target.value)} placeholder="Soni (0)"
                      className="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm outline-none focus:border-sky-500 mono text-slate-100" />
                    <button onClick={addProduct} className="bg-sky-500 text-slate-950 font-bold px-5 rounded-lg active:bg-sky-600">＋</button>
                  </div>
                </div>
              )}
              <div className="space-y-2.5">
                {filtered.map((p)=>{
                  const ombor = p.total - p.out, gone = ombor<=0;
                  return (
                    <div key={p.id} className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
                      <div onClick={()=> editId!==p.id && openSheet(p.id)} className={editId!==p.id ? "cursor-pointer active:bg-slate-800" : ""}>
                        <div className="flex items-start justify-between px-4 pt-3">
                          <div className="font-bold text-[15px]">{p.name}</div>
                          <div className="flex items-center gap-2 shrink-0">
                            <span className="text-xs text-slate-500 mono">Jami {fmt(p.total)}</span>
                            <button onClick={(e)=>{ e.stopPropagation(); setEditId(editId===p.id?null:p.id); setDelId(null); }}
                              className={`text-base px-1 ${editId===p.id?"opacity-100":"opacity-60"}`} title="Tahrirlash">✏️</button>
                          </div>
                        </div>
                        <div className="grid grid-cols-2 mt-2 border-t border-slate-800">
                          <div className="py-3 text-center border-r border-slate-800">
                            <div className="mono text-3xl font-bold leading-none text-amber-400">{fmt(p.out)}</div>
                            <div className="text-[10px] uppercase tracking-wider text-slate-500 mt-1.5">Arendada</div>
                          </div>
                          <div className="py-3 text-center">
                            <div className={`mono text-3xl font-bold leading-none ${gone?"text-rose-400":"text-emerald-400"}`}>{fmt(ombor)}</div>
                            <div className="text-[10px] uppercase tracking-wider text-slate-500 mt-1.5">Omborda</div>
                          </div>
                        </div>
                      </div>
                      {editId===p.id && (
                        <div className="border-t border-slate-800 bg-slate-950/50 px-4 py-3 space-y-2">
                          <div className="flex items-center gap-2">
                            <span className="text-xs text-slate-500 w-8">Nom:</span>
                            <input type="text" defaultValue={p.name} onBlur={e=>{ if(e.target.value.trim() && e.target.value.trim()!==p.name) renameProduct(p.id, e.target.value); }}
                              className="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm outline-none focus:border-sky-500 text-slate-100" />
                          </div>
                          <div className="flex items-center gap-2">
                            <span className="text-xs text-slate-500 w-8">Jami:</span>
                            <input type="number" defaultValue={p.total} onBlur={e=>setTotal(p.id,e.target.value)}
                              className="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm outline-none focus:border-amber-500 mono text-slate-100" />
                            {delId===p.id ? (
                              <div className="flex gap-1">
                                <button onClick={()=>delProduct(p.id)} className="text-xs bg-rose-600 text-white px-2 py-1.5 rounded font-semibold">Ha</button>
                                <button onClick={()=>setDelId(null)} className="text-xs bg-slate-700 text-slate-200 px-2 py-1.5 rounded font-semibold">Yo'q</button>
                              </div>
                            ) : (
                              <button onClick={()=>setDelId(p.id)} className="text-rose-400/70 text-lg px-1" title="O'chirish">🗑</button>
                            )}
                          </div>
                          <button onClick={()=>setEditId(null)} className="text-xs text-emerald-400 font-semibold pt-1">✓ Yopish</button>
                        </div>
                      )}
                    </div>
                  );
                })}
                {filtered.length===0 && <div className="text-center text-slate-500 text-sm py-10">"{search}" topilmadi.</div>}
              </div>
              {edit && (
                <div className="mt-6 border-t border-slate-800 pt-4">
                  {!confirmReset ? (
                    <button onClick={()=>setConfirmReset(true)} className="text-xs text-rose-400/80 font-medium">Hammasini 0 qilish (sonlar va tarix tozalanadi)</button>
                  ) : (
                    <div className="bg-rose-950/40 border border-rose-900/60 rounded-xl p-3">
                      <p className="text-sm text-rose-200 mb-2">Barcha sonlar 0 bo'ladi va tarix o'chadi. Ishonchingiz komilmi?</p>
                      <div className="flex gap-2">
                        <button onClick={doReset} className="flex-1 bg-rose-600 text-white text-sm font-semibold py-2 rounded-lg">Ha, 0 qilish</button>
                        <button onClick={()=>setConfirmReset(false)} className="flex-1 bg-slate-800 text-slate-300 text-sm font-semibold py-2 rounded-lg">Bekor</button>
                      </div>
                    </div>
                  )}
                  <button onClick={logout} className="block mt-4 text-xs text-slate-500 font-medium">Chiqish (parolni unutish)</button>
                </div>
              )}
            </div>
          )}

          {tab==="tarix" && (
            <div className="max-w-lg mx-auto px-4 mt-4">
              {!histProduct ? (
                <div className="space-y-2">
                  {products.map((p)=>{
                    const items = history.filter(h=>h.pid===p.id);
                    const last = items[0];
                    return (
                      <button key={p.id} onClick={()=>setHistProduct(p.id)} className="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3.5 flex items-center justify-between active:bg-slate-800 text-left">
                        <div className="min-w-0">
                          <div className="font-semibold text-[15px]">{p.name}</div>
                          <div className="text-xs text-slate-500 mt-0.5">{items.length?`${items.length} ta harakat · oxirgi ${fmtTime(last.ts)}`:"hali harakat yo'q"}</div>
                        </div>
                        <div className="flex items-center gap-2 shrink-0">
                          {items.length>0 && <span className="mono text-xs font-bold text-slate-400 bg-slate-800 rounded-full px-2 py-0.5">{items.length}</span>}
                          <span className="text-slate-600 text-xl">›</span>
                        </div>
                      </button>
                    );
                  })}
                </div>
              ) : (
                <div>
                  <button onClick={()=>setHistProduct(null)} className="flex items-center gap-1 text-sm text-slate-400 mb-3 active:text-slate-200">‹ Barcha tovarlar</button>
                  <h3 className="font-bold text-lg mb-3">{products.find(p=>p.id===histProduct)?.name}</h3>
                  <div className="space-y-2">
                    {history.filter(h=>h.pid===histProduct).length===0 ? (
                      <div className="text-center text-slate-500 text-sm py-10">Bu tovarda hali harakat yo'q.</div>
                    ) : history.filter(h=>h.pid===histProduct).map((h)=>{
                      const cfg = {
                        out:{bg:"bg-amber-500/15",tx:"text-amber-400",ic:"↑",sign:"−",lbl:"chiqdi"},
                        ret:{bg:"bg-emerald-500/15",tx:"text-emerald-400",ic:"↓",sign:"+",lbl:"qaytdi"},
                        add:{bg:"bg-sky-500/15",tx:"text-sky-400",ic:"＋",sign:"+",lbl:"qo'shildi"},
                        writeoff:{bg:"bg-rose-500/15",tx:"text-rose-400",ic:"✕",sign:"−",lbl:"hisobdan chiqarildi"},
                      }[h.type];
                      return (
                        <div key={h.id} className="bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 flex items-center gap-3">
                          <div className={`w-10 h-10 rounded-lg flex items-center justify-center text-lg font-bold shrink-0 ${cfg.bg} ${cfg.tx}`}>{cfg.ic}</div>
                          <div className="flex-1 min-w-0">
                            <div className="font-semibold text-sm capitalize">{cfg.lbl}</div>
                            <div className="text-xs text-slate-500">{fmtTime(h.ts)}</div>
                          </div>
                          <div className="text-right mono">
                            <div className={`text-lg font-bold leading-none ${cfg.tx}`}>{cfg.sign}{fmt(h.qty)}</div>
                            <div className="text-[11px] text-slate-500 mt-1">omborda {fmt(h.ombor)}</div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          )}

          {active && (
            <div className="fixed inset-0 z-40 flex items-end justify-center">
              <div className="absolute inset-0 bg-black/60" onClick={closeSheet} />
              <div className="relative w-full max-w-lg bg-slate-900 border-t border-slate-700 rounded-t-2xl p-5 pb-8">
                <div className="w-10 h-1 bg-slate-700 rounded-full mx-auto mb-4" />
                <div className="flex items-baseline justify-between mb-1">
                  <h3 className="text-lg font-bold">{active.name}</h3>
                  <span className="text-xs text-slate-500 uppercase tracking-wider">Jami {fmt(active.total)}</span>
                </div>
                <div className="flex gap-4 mb-4 mono">
                  <span className="text-sm text-amber-400">Arendada {fmt(active.out)}</span>
                  <span className="text-sm text-emerald-400">Omborda {fmt(active.total-active.out)}</span>
                </div>
                <input autoFocus type="number" value={qty} onChange={e=>{setQty(e.target.value);setErr("");}} placeholder="Soni…"
                  className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-lg outline-none focus:border-slate-500 mb-3 mono text-slate-100" />
                <div className="flex gap-2 mb-4">
                  {QUICK.map(q=>(
                    <button key={q} onClick={()=>{setQty(String(q));setErr("");}} className="flex-1 bg-slate-800 text-slate-300 text-sm font-semibold py-2 rounded-lg active:bg-slate-700">{q}</button>
                  ))}
                </div>
                {err && <div className="text-rose-400 text-sm mb-3 text-center">{err}</div>}
                <div className="flex gap-3 mb-3">
                  <button onClick={()=>doMove("out")} className="flex-1 bg-amber-500 text-slate-950 font-bold py-3.5 rounded-xl active:bg-amber-600">Chiqdi ↑</button>
                  <button onClick={()=>doMove("ret")} className="flex-1 bg-emerald-500 text-slate-950 font-bold py-3.5 rounded-xl active:bg-emerald-600">Qaytdi ↓</button>
                </div>
                <div className="flex gap-2">
                  <button onClick={addStock} className="flex-1 border border-sky-700/60 text-sky-300 text-sm font-semibold py-2.5 rounded-xl active:bg-sky-950/40">＋ Qo'shish</button>
                  <button onClick={()=>doMove("writeoff")} className="flex-1 border border-rose-700/60 text-rose-300 text-sm font-semibold py-2.5 rounded-xl active:bg-rose-950/40">✕ Hisobdan chiqarish</button>
                </div>
              </div>
            </div>
          )}

          {toast && (
            <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50">
              <div className={`px-5 py-3 rounded-xl shadow-lg text-sm font-semibold ${toast.type==="out"?"bg-amber-500 text-slate-950":toast.type==="add"?"bg-sky-500 text-slate-950":toast.type==="writeoff"?"bg-rose-600 text-white":toast.type==="err"?"bg-rose-600 text-white":"bg-emerald-500 text-slate-950"}`}>{toast.text}</div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
